<style>
body{
    margin:0;
    font-family:Arial;
    background:#121212;
    color:white;
}

header{
    background:#1f1f1f;
    padding:20px;
    text-align:center;
    font-size:30px;
    font-weight:bold;
}

.games{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:20px;
}

.card{
    background:#1e1e1e;
    border-radius:12px;
    overflow:hidden;
    transition:0.3s;
}

.card:hover{
    transform:scale(1.05);
}

.card img{
    width:100%;
    height:160px;
    object-fit:cover;
}

.card h2{
    padding:10px;
}

.play-btn{
    display:block;
    text-align:center;
    background:#00b894;
    color:white;
    padding:12px;
    text-decoration:none;
    font-weight:bold;
}

.play-btn:hover{
    background:#00a383;
}

.math-btn,
.play-btn{
    display:block;
    width:240px;
    max-width:calc(100% - 20px);
    height:90px;
    margin:12px auto;
    font-size:0.9rem;
    cursor:pointer;
    padding:6px 10px;
    border-radius:6px;
    background-color:#4CAF50;
    color:white;
    border:none;
    font-weight:bold;
}

.math-btn:hover,
.play-btn:hover{
    background-color:#45a049;
}

/* Larger, full-screen game hub layout */
html, body { min-height:100%; }
body { min-height:100vh; }
header { padding:clamp(18px, 3vh, 32px); font-size:clamp(30px, 4vw, 44px); }
.games {
    min-height:calc(100vh - 105px);
    box-sizing:border-box;
    grid-template-columns:repeat(2, minmax(0, 1fr));
    grid-auto-rows:minmax(250px, 1fr);
    gap:clamp(16px, 2vw, 28px);
    padding:clamp(16px, 2.5vw, 32px);
}
.card { display:flex; flex-direction:column; min-width:0; }
.card img { height:clamp(150px, 27vh, 300px); flex-shrink:0; }
.card h2 { font-size:clamp(22px, 2.2vw, 32px); margin:8px 0; }
.math-btn, .play-btn { width:min(300px, calc(100% - 20px)); height:clamp(70px, 10vh, 100px); font-size:clamp(16px, 1.5vw, 21px); }
@media (max-width:650px) {
    .games { grid-template-columns:1fr; grid-auto-rows:auto; }
    .card img { height:220px; }
}

<script>

function openGameCDN(){
    openCDN('https://cdn.jsdelivr.net/gh/Bobwastaked/ugs-singlefile/AASINGLEFILE.html', 'Game');
}

function openCDN(baseUrl, pageName){
    // Open a blank tab immediately, then fetch and write the CDN HTML into it.
    // This applies the same loading method to every card button for each card button.
    const newWin = window.open('about:blank', '_blank');
    if (!newWin) {
        alert('Please allow pop-ups for this page, then try again.');
        return;
    }

    const cdnUrl = baseUrl + (baseUrl.includes('?') ? '&' : '?') + 't=' + Date.now();
    newWin.document.open();
    newWin.document.write('<!doctype html><html><head><title>Loading ' + String(pageName || 'page').replace(/[&<>"']/g, '') + '...</title><meta name="viewport" content="width=device-width, initial-scale=1"></head><body style="font-family:Arial,sans-serif;padding:24px">Loading...</body></html>');
    newWin.document.close();

    fetch(cdnUrl)
        .then(response => {
            if (!response.ok) throw new Error('HTTP ' + response.status);
            return response.text();
        })
        .then(html => {
            if (newWin && !newWin.closed) {
                newWin.document.open();
                newWin.document.write(html);
                newWin.document.close();
            }
        })
        .catch(error => {
            if (newWin && !newWin.closed) {
                newWin.document.open();
                newWin.document.write('<!doctype html><html><head><meta charset="utf-8"><title>Unable to load</title></head><body style="font-family:Arial,sans-serif;padding:24px"><h2>Could not load ' + String(pageName || 'page').replace(/[&<>"']/g, '') + '</h2><p>Please check your internet connection and try again.</p><p><a href="' + cdnUrl.replace(/&/g, '&amp;').replace(/"/g, '&quot;') + '">Open the CDN page directly</a></p></body></html>');
                newWin.document.close();
            }
            console.error('CDN HTML fetch failed:', error);
        });
}
</script>
